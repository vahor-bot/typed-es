<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Typed ES infers Elasticsearch response types</title>
  <desc id="description">A typed Elasticsearch query on the left and the inferred response type on the right.</desc>
  <rect width="1200" height="630" rx="18" fill="#111827"/>
  <text x="60" y="70" fill="#f9fafb" font-family="ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="700">Write the query. Get the response type.</text>
  <text x="60" y="105" fill="#9ca3af" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18">typed-es keeps Elasticsearch queries and TypeScript responses in sync.</text>

  <rect x="55" y="145" width="520" height="425" rx="12" fill="#1f2937" stroke="#374151"/>
  <text x="85" y="185" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, monospace" font-size="18">const query = typedEs(client, {</text>
  <text x="105" y="220" fill="#d1d5db" font-family="ui-monospace, SFMono-Regular, monospace" font-size="17">index: "products",</text>
  <text x="105" y="255" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, monospace" font-size="17">_source: ["id", "name"],</text>
  <text x="105" y="290" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, monospace" font-size="17">fields: [{ field: "price" }],</text>
  <text x="105" y="325" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, monospace" font-size="17">aggs: {</text>
  <text x="125" y="360" fill="#d1d5db" font-family="ui-monospace, SFMono-Regular, monospace" font-size="17">avg_price: { avg: { field: "price" } },</text>
  <text x="105" y="395" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, monospace" font-size="17">},</text>
  <text x="85" y="430" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, monospace" font-size="18">});</text>
  <text x="85" y="490" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, monospace" font-size="17">const result = await client.search(query);</text>
  <text x="85" y="530" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, monospace" font-size="16">// no response interfaces to maintain</text>

  <path d="M 600 355 H 650" stroke="#60a5fa" stroke-width="4"/>
  <path d="M 640 340 L 660 355 L 640 370" fill="none" stroke="#60a5fa" stroke-width="4"/>

  <rect x="680" y="145" width="465" height="425" rx="12" fill="#172554" stroke="#2563eb" stroke-width="2"/>
  <text x="715" y="190" fill="#bfdbfe" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">Inferred response</text>
  <text x="715" y="235" fill="#e0f2fe" font-family="ui-monospace, SFMono-Regular, monospace" font-size="17">result.hits.hits[0]._source</text>
  <text x="715" y="275" fill="#86efac" font-family="ui-monospace, SFMono-Regular, monospace" font-size="17">{ id: number; name: string }</text>
  <text x="715" y="340" fill="#e0f2fe" font-family="ui-monospace, SFMono-Regular, monospace" font-size="17">result.aggregations.avg_price</text>
  <text x="715" y="380" fill="#86efac" font-family="ui-monospace, SFMono-Regular, monospace" font-size="17">{ value: number | null }</text>
  <text x="715" y="445" fill="#e0f2fe" font-family="ui-monospace, SFMono-Regular, monospace" font-size="17">result.fields.price</text>
  <text x="715" y="485" fill="#86efac" font-family="ui-monospace, SFMono-Regular, monospace" font-size="17">number[]</text>
  <text x="715" y="535" fill="#93c5fd" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">Automatically synchronized with the query</text>
</svg>
